<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#031820;--teal:#0b5c6e;--aqua:#7fe9e4;--foam:#eafcff;--glass:rgba(255,255,255,.07);--edge:rgba(255,255,255,.28)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;color:var(--foam);background:linear-gradient(180deg,#052a36,var(--deep) 70%);overflow-x:hidden}
.water{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.b1{width:46vw;height:46vw;left:-8vw;top:-10vw;background:#12a0a8}
.b2{width:38vw;height:38vw;right:-6vw;top:18vh;background:#2f6fd0;animation-duration:23s}
.b3{width:34vw;height:34vw;left:30vw;bottom:-14vw;background:#19c3a6;animation-duration:27s}
@keyframes drift{to{transform:translate(6vw,5vh) scale(1.15)}}
.ripple{position:absolute;inset:-5%;filter:url(#wave);opacity:.5;
 background:repeating-linear-gradient(115deg,transparent 0 38px,rgba(180,255,250,.16) 40px 46px,transparent 48px 90px)}
.wv{position:absolute;left:0;bottom:0;width:200%;height:22vh;animation:slide 14s linear infinite}
.wv.w2{height:17vh;opacity:.6;animation-duration:22s;animation-direction:reverse}
@keyframes slide{to{transform:translateX(-50%)}}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px 18px 60px;display:grid;grid-template-columns:1fr 290px;gap:18px}
header{grid-column:1/-1;padding:6px 4px}
h1{font-weight:800;font-size:clamp(28px,4vw,44px);letter-spacing:-.02em}
header p{opacity:.75;margin-top:4px}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -12px 28px rgba(127,233,228,.07),0 18px 50px rgba(0,0,0,.25)}
.panel{padding:20px}
label{font-weight:600;font-size:14px;opacity:.85;display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font:inherit;font-size:14px;color:var(--foam);padding:8px 15px;border-radius:99px;border:1px solid var(--edge);background:rgba(255,255,255,.05);cursor:pointer;transition:.2s}
.chip:hover{background:rgba(255,255,255,.14)}
.chip[aria-pressed=true]{background:rgba(127,233,228,.28);border-color:var(--aqua);box-shadow:0 0 18px rgba(127,233,228,.35)}
textarea{width:100%;min-height:96px;resize:vertical;font:inherit;color:var(--foam);padding:14px 16px;border-radius:18px;border:1px solid var(--edge);background:rgba(255,255,255,.05);outline:none}
textarea::placeholder{color:rgba(234,252,255,.5)}
textarea:focus,.chip:focus-visible,.btn:focus-visible,.h:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;color:#022;padding:12px 22px;border-radius:99px;border:0;cursor:pointer;background:linear-gradient(180deg,#c9fffb,var(--aqua));box-shadow:0 8px 24px rgba(127,233,228,.35),inset 0 1px 0 #fff;transition:.2s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{color:var(--foam);background:rgba(255,255,255,.08);border:1px solid var(--edge);box-shadow:none}
.stage{margin-top:18px;min-height:340px;display:grid;place-items:center;border-radius:20px;border:1px dashed var(--edge);
 background-image:linear-gradient(45deg,rgba(255,255,255,.05) 25%,transparent 25% 75%,rgba(255,255,255,.05) 75%),linear-gradient(45deg,rgba(255,255,255,.05) 25%,transparent 25% 75%,rgba(255,255,255,.05) 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.stage img{max-width:92%;max-height:420px}
.msg{opacity:.7;padding:20px;text-align:center}.err{color:#ffb4a8;opacity:1}
aside{padding:18px;align-self:start;max-height:78vh;overflow:auto}
aside h2{font-size:17px;margin-bottom:12px}
.h{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--foam);padding:8px;border-radius:16px;border:1px solid transparent;background:transparent;cursor:pointer;margin-bottom:6px}
.h:hover{background:rgba(255,255,255,.1);border-color:var(--edge)}
.h img{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.1);padding:4px;flex:none}
.h span{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.h small{display:block;opacity:.6;font-size:11px}
@media(max-width:820px){main{grid-template-columns:1fr}aside{max-height:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="wave"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="2" seed="3"><animate attributeName="baseFrequency" dur="16s" values="0.008 0.02;0.014 0.03;0.008 0.02" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" scale="70"/></filter></svg>
<div class="water" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div class="ripple"></div>
<svg class="wv w2" viewBox="0 0 1440 200" preserveAspectRatio="none"><path fill="rgba(127,233,228,.18)" d="M0 90C120 40 240 40 360 90S600 140 720 90s240-50 360 0 240 50 360 0V200H0z"/></svg>
<svg class="wv" viewBox="0 0 1440 200" preserveAspectRatio="none"><path fill="rgba(255,255,255,.1)" d="M0 110C120 60 240 60 360 110S600 160 720 110s240-50 360 0 240 50 360 0V200H0z"/></svg></div>
<main>
<header><h1>SVG Studio</h1><p>Describe an image. Get a PNG to download.</p></header>
<section class="glass panel">
 <label>Image type</label>
 <div class="chips" id="types"></div>
 <label for="p">Prompt</label>
 <textarea id="p" placeholder="Enter prompt here, e.g. a blue rocket launching over mountains" maxlength="500"></textarea>
 <div class="row"><button class="btn" id="go">Generate</button><button class="btn ghost" id="dl" hidden>Download PNG</button></div>
 <div class="stage" id="stage"><p class="msg">Your image will appear here.</p></div>
</section>
<aside class="glass"><h2>History</h2><div id="hist"><p class="msg">Nothing yet. Generate your first image.</p></div></aside>
</main>
<script>
const TYPES=["Icon","Logo","Illustration","Pattern","Diagram","Sticker","Background"];
let type="Icon",cur=null;
const $=id=>document.getElementById(id);
const uri=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('types').innerHTML=TYPES.map(t=>`<button class="chip" aria-pressed="${t==type}" data-t="${t}">${t}</button>`).join('');
$('types').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;type=b.dataset.t;[...$('types').children].forEach(c=>c.setAttribute('aria-pressed',c==b))};
function show(it){cur=it;$('stage').innerHTML=`<img alt="${esc(it.prompt)}" src="${uri(it.svg)}">`;$('dl').hidden=false}
const K='svgstudio_hist';
function getH(){try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}}
function addH(it){try{localStorage.setItem(K,JSON.stringify([it,...getH()].slice(0,40)))}catch(e){}}
function loadHist(){const h=getH();
 if(!h.length)return;
 $('hist').innerHTML=h.map(i=>`<button class="h" data-id="${i.id}"><img alt="" src="${uri(i.svg)}"><span>${esc(i.prompt)}<small>${i.type}</small></span></button>`).join('');
 $('hist').onclick=e=>{const b=e.target.closest('.h');if(b)show(h.find(x=>x.id==b.dataset.id))}}
$('go').onclick=async()=>{const prompt=$('p').value.trim();
 if(!prompt){$('stage').innerHTML='<p class="msg err">Enter a prompt first.</p>';return}
 $('go').disabled=true;$('go').textContent='Generating...';$('dl').hidden=true;
 try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,type})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||'Something went wrong.');
  show(d);addH(d);loadHist()}
 catch(e){$('stage').innerHTML=`<p class="msg err">${esc(e.message)}</p>`}
 $('go').disabled=false;$('go').textContent='Generate'};
$('dl').onclick=()=>{if(!cur)return;const img=new Image();
 img.onload=()=>{const vb=(cur.svg.match(/viewBox="([\d.\s-]+)"/)||[])[1],[,,w,h]=vb?vb.trim().split(/\s+/).map(Number):[0,0,512,512];
  const S=1024,k=Math.min(S/w,S/h),dw=w*k,dh=h*k,c=document.createElement('canvas');c.width=c.height=S;
  c.getContext('2d').drawImage(img,(S-dw)/2,(S-dh)/2,dw,dh);
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
   a.download=(cur.prompt.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40)||'image')+'.png';a.click();URL.revokeObjectURL(a.href)})};
 img.src=uri(cur.svg)};
loadHist();
</script></body></html>
